name: CI

# Draft pull requests do not start this (GitHub Actions minutes are paid for a private repository).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The page tests use the Chrome of the runner. A missing Chrome must not pass as "skipped".
      - name: Chrome is there
        run: google-chrome --version
      - name: Tests
        run: node --test "tests/*.test.js"
